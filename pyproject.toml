[project]
name = "macpic-browser"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "osxphotos>=0.78.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
exclude = [".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
